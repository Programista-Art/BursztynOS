<!doctype html><html><head><title>js-prototype</title></head><body style="margin:8px;color:#222;background:#fff"><div id="marker" style="width:600px;height:180px;background:#883333"><h1>js-prototype</h1><p id="result">Waiting for bounded JavaScript...</p></div><script>function pass(){document.getElementById("marker").style.backgroundColor="#33bb77";}function Person(name){this.name=name;}Person.prototype.say=function(){return this.name;};var p=new Person('Jan');var q=Object.create(p);if(q.say()=='Jan'){document.getElementById('result').textContent=q.say()+' inherited prototype method';pass();}</script></body></html>
