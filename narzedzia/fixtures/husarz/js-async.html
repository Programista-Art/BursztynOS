<!doctype html><html><head><title>js-async</title></head><body style="margin:8px;color:#222;background:#fff"><div id="marker" style="width:600px;height:180px;background:#883333"><h1>js-async</h1><p id="result">Waiting for bounded JavaScript...</p></div><script>function pass(){document.getElementById("marker").style.backgroundColor="#33bb77";}async function load(){var a=await Promise.resolve(3);try{await Promise.reject(4);}catch(e){a+=e;}return a;}load().then(x=>{if(x==7){document.getElementById('result').textContent='Async result: '+x;pass();}});</script></body></html>
