<!doctype html><html><head><title>js-fetch</title></head><body style="margin:8px;color:#222;background:#fff"><div id="marker" style="width:600px;height:180px;background:#883333"><h1>js-fetch</h1><p id="result">Waiting for bounded JavaScript...</p></div><script>function pass(){document.getElementById("marker").style.backgroundColor="#33bb77";}async function load(){var r=await fetch('js-data.json');if(!r.ok)throw new Error('HTTP');var data=await r.json();if(data.answer==42){document.getElementById('result').textContent=data.message+' '+data.answer;try{await fetch('http://10.0.2.101/cross-only.json');}catch(e){pass();}}}load();</script></body></html>
