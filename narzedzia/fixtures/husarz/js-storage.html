<!doctype html><html><head><title>js-storage</title></head><body style="margin:8px;color:#222;background:#fff"><div id="marker" style="width:600px;height:180px;background:#883333"><h1>js-storage</h1><p id="result">Waiting for bounded JavaScript...</p></div><script>function pass(){document.getElementById("marker").style.backgroundColor="#33bb77";}var old=localStorage.getItem('milestone');var visits=old==null?0:Number(old);localStorage.setItem('milestone',String(visits+1));var session=sessionStorage.getItem('tab');sessionStorage.setItem('tab','owned');document.getElementById('result').textContent='Persistent visits: '+(visits+1)+'; previous session: '+session;if(visits>0)document.getElementById('marker').style.backgroundColor='#3366cc';else pass();</script></body></html>
