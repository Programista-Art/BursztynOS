<!doctype html><html><head><title>js-promise</title></head><body style="margin:8px;color:#222;background:#fff"><div id="marker" style="width:600px;height:180px;background:#883333"><h1>js-promise</h1><p id="result">Waiting for bounded JavaScript...</p></div><script>function pass(){document.getElementById("marker").style.backgroundColor="#33bb77";}var order='sync';Promise.resolve('a').then(x=>{order+=':'+x;return Promise.resolve('b');}).then(x=>{order+=':'+x;if(order=='sync:a:b'){document.getElementById('result').textContent=order;pass();}});</script></body></html>
