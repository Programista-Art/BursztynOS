<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:white;color:black}#marker{width:240px;height:64px;background:#bb3344}button,a,input,select{display:block;margin:8px;width:200px;height:32px}</style></head><body><div id="marker">click pending</div><div id="outer"><button id="button" style="background:#997744" type="button">Click script</button><a id="link" style="background:#aa66bb" href="/js-forbidden.html">Prevent navigation</a></div><script>var m=document.getElementById('marker');document.getElementById('button').addEventListener('click',function(e){m.textContent='clicked';m.style.backgroundColor='#33bb77';});document.getElementById('outer').addEventListener('click',function(e){m.className='bubbled';});document.getElementById('link').addEventListener('click',function(e){e.preventDefault();m.style.backgroundColor='#3366cc';});</script></body></html>
