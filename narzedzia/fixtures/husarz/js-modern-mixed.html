<!doctype html><html><head><title>js-modern-mixed</title></head><body style="margin:8px;color:#222;background:#fff"><div style="width:600px;height:24px;background:#446688"></div><div id="marker" style="width:600px;height:180px;background:#883333"><h1>js-modern-mixed</h1><p id="result">Waiting for bounded JavaScript...</p></div><script>function pass(){document.getElementById("marker").style.backgroundColor="#3366cc";}function State(){this.value=0;}State.prototype.add=function(x){this.value+=x;};var state=new State();async function update(){try{var r=await fetch('slow-js-data.json');var data=await r.json();state.add(data.answer);localStorage.setItem('mixed',String(state.value));document.getElementById('result').textContent='Async fetch + JSON + storage: '+state.value;pass();var pulses=0;var pulse=setInterval(async function(){await 1;pulses++;document.getElementById('result').textContent='Mixed async tick '+pulses;if(pulses==16)clearInterval(pulse);},100);}catch(e){document.getElementById('result').textContent=e.name;}}document.getElementById('marker').addEventListener('click',()=>update());setTimeout(()=>update(),10);</script></body></html>
