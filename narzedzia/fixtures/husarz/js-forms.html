<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:white;color:black}#marker{width:240px;height:64px;background:#bb3344}button,a,input,select{display:block;margin:8px;width:200px;height:32px}</style></head><body><div id="marker">forms pending</div><form action="/js-forbidden.html"><input id="field" name="q"><input type="checkbox" id="check"><select id="choice"><option value="a">A</option><option value="b">B</option></select><button id="submit" style="background:#997744">Submit prevented</button></form><script>var m=document.getElementById('marker');var f=document.getElementById('field');f.addEventListener('keydown',function(e){if(e.key=='z'){e.preventDefault();}});f.addEventListener('input',function(e){m.textContent=f.value;m.style.backgroundColor='#33bb77';});document.getElementById('submit').addEventListener('click',function(e){m.style.backgroundColor='#cc8844';});document.querySelector('form').addEventListener('submit',function(e){e.preventDefault();document.getElementById('check').checked=true;document.getElementById('choice').value='b';m.style.backgroundColor='#3366cc';});</script></body></html>
