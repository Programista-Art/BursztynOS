# Standalone GRUB Bursztyn OS: Bezpieczny rozruch A/B z automatycznym powrotem (rollback)
search --no-floppy --file --set=bursztyn_esp /EFI/BOOT/BOOTX64.EFI
if [ -z "$bursztyn_esp" ]; then
    search --no-floppy --file --set=bursztyn_esp /boot/system_operacyjny.bin
fi

if [ -n "$bursztyn_esp" ]; then
    set root=$bursztyn_esp
    # Domyslne wartosci awaryjne (unconditional recovery fallback)
    set bursztyn_potwierdzony="A"
    set bursztyn_oczekujacy="BRAK"
    set bursztyn_proby="0"

    # Wczytaj stan z bloku srodowiska GRUB
    load_env -f /boot/grub/grubenv

    # Walidacja slotu potwierdzonego (ochrona przed uszkodzeniem grubenv)
    if [ "$bursztyn_potwierdzony" != "A" -a "$bursztyn_potwierdzony" != "B" ]; then
        set bursztyn_potwierdzony="A"
    fi

    set wybrany_slot="$bursztyn_potwierdzony"

    # Sprawdz, czy istnieje slot oczekujacy na weryfikacje
    if [ "$bursztyn_oczekujacy" = "A" -o "$bursztyn_oczekujacy" = "B" ]; then
        if [ "$bursztyn_proby" = "0" ]; then
            # Pierwsza proba rozruchu nowego slotu
            set wybrany_slot="$bursztyn_oczekujacy"
            set bursztyn_proby="1"
            save_env -f /boot/grub/grubenv bursztyn_proby
        else
            # Limit prob wyczerpany - automatyczny powrot do potwierdzonego slotu!
            set wybrany_slot="$bursztyn_potwierdzony"
            set bursztyn_oczekujacy="NIEUDANY"
            save_env -f /boot/grub/grubenv bursztyn_oczekujacy
        fi
    fi

    # Kontrolowana awaria testowa (tylko wartosc B jest dozwolona)
    set awaria_arg=""
    if [ "$bursztyn_awaria" = "B" ]; then
        set awaria_arg="bursztyn.awaria_slotu=B"
    fi

    # Uruchomienie wybranego slotu
    if [ "$wybrany_slot" = "B" ]; then
        if [ -f /boot/jadro_b.bin ]; then
            multiboot2 /boot/jadro_b.bin bursztyn.installed=1 bursztyn.slot=B $awaria_arg
            boot
        fi
        # Awaryjny fallback na A gdyby jadro B zostalo skasowane
        set wybrany_slot="A"
    fi

    if [ -f /boot/jadro_a.bin ]; then
        multiboot2 /boot/jadro_a.bin bursztyn.installed=1 bursztyn.slot=A
        boot
    fi

    # Zgodnosc wsteczna ze starymi instalacjami
    if [ -f /boot/system_operacyjny.bin ]; then
        multiboot2 /boot/system_operacyjny.bin bursztyn.installed=1 bursztyn.slot=A
        boot
    fi
fi

echo "Bursztyn OS: brak poprawnej konfiguracji na startowym ESP."
halt

