# Standalone GRUB ma własny memdisk, więc nie wolno rozwiązywać ścieżki jądra
# względem jego prefiksu. Znajdź ESP po pliku jądra i uruchom je bezpośrednio.
# Pełny grub.cfg nadal jest instalowany na ESP jako jawny artefakt/recovery,
# ale ścieżka fallback UEFI nie zależy od zagnieżdżonego `configfile`.
search --no-floppy --file --set=bursztyn_esp /boot/system_operacyjny.bin
if [ -n "$bursztyn_esp" ]; then
    set root=$bursztyn_esp
    multiboot2 /boot/system_operacyjny.bin bursztyn.installed=1
    boot
fi
echo "Bursztyn OS: brak poprawnej konfiguracji na startowym ESP."
halt
