set timeout=0
set default=0

menuentry "Bursztyn OS" {
    insmod all_video
    set gfxmode=3440x1440x32
    set gfxpayload=keep
    multiboot2 /boot/system_operacyjny.bin bursztyn.refresh=60
    module2 /boot/tapety.pak tapety.pak
    module2 /boot/ustawienia.bur bsf-settings
    module2 /czcionki/ttf/DejaVuSans-Bold.ttf bsf/DejaVuSans-Bold.ttf
    module2 /czcionki/ttf/DejaVuSans.ttf bsf/DejaVuSans.ttf
    module2 /czcionki/ttf/DejaVuSansMono.ttf bsf/DejaVuSansMono.ttf
    module2 /czcionki/ttf/DejaVuSerifCondensed-Italic.ttf bsf/DejaVuSerifCondensed-Italic.ttf
    module2 /czcionki/ttf/LICENSE-DejaVu.txt bsf/LICENSE-DejaVu.txt
    module2 /czcionki/ttf/LICENSE-stb.txt bsf/LICENSE-stb.txt
    module2 /czcionki/ttf/SOURCE.txt bsf/SOURCE.txt
    boot
}

